<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Log Masuk · Portal Klien</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/css/design-system.css"><link rel="stylesheet" href="/static/css/client-login.css"><script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script><script defer src="/static/login.js"></script></head>
<body class="login-body"><main class="login-container"><div class="login-card"><div class="login-avatar"><img src="{{ client_logo }}" alt="Logo {{ client_name }}"></div><h1>PORTAL KLIEN</h1><p class="login-subtitle">SISTEM LEEA • LOG MASUK KLIEN</p><form method="post" action="/login" class="login-form"><div class="form-group"><label for="username">ID LOG MASUK (USERNAME)</label><input id="username" name="username" type="text" required autofocus autocomplete="username" placeholder="Masukkan ID log masuk"></div><div class="form-group"><label for="password">KATA SANDI</label><div class="password-wrapper"><input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Masukkan kata sandi"><button id="toggle-password" class="toggle-password" type="button" aria-label="Tunjuk kata sandi" aria-pressed="false" aria-controls="password"><i data-lucide="eye" aria-hidden="true"></i></button></div></div>{% if error %}<p class="error-message" role="alert">{{ error }}</p>{% endif %}<button class="btn-login" type="submit"><i data-lucide="log-in" aria-hidden="true"></i> Log Masuk</button></form><div class="live-support-box"><div class="live-support-icon"><i data-lucide="headset" aria-hidden="true"></i></div><div><div class="live-support-status"><span class="status-dot" aria-hidden="true"></span>LIVE SUPPORT</div><p>Ada masalah log masuk? Hubungi admin untuk bantuan.</p></div></div></div><footer class="login-footer">© Sistem LeeA · {{ client_code }}</footer></main></body></html>
